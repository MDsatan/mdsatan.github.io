# Site settings
title: Sergei Zelentsov
email: sergei@mdst.space
description: Security engineer and musician.
author: Sergei Zelentsov

url: "https://mdst.space"
baseurl: ""

# No theme is used. The site is fully self-contained:
#   _layouts/default.html  — document shell + font loading
#   assets/css/style.css   — Nothing-OS design language
#   index.md, 404.html     — content
#
# Keeping `theme:` / `remote_theme:` unset is deliberate: the old
# jekyll-theme-minimal stylesheet styled bare <header>/<section>/<footer>
# with position:fixed and float, which collided with this site's markup.

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

# Cache-busting token for /assets/*. Appended as ?v=N in the layout.
#
# Why this exists: the CDN (Cloudflare) caches CSS/JS for 4 hours
# (cache-control: max-age=14400, cf-cache-status: HIT) while HTML is
# served DYNAMIC with a 10 minute TTL. After a deploy the new HTML ships
# immediately but still points at the previously cached stylesheet, so
# for up to 4 hours visitors get new markup with old CSS — broken layout.
# Bump this number whenever style.css or player.js changes.
asset_version: 3

exclude:
  - "*.old"
  - gemfile
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor